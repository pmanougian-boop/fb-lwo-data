# Refresh the Flight Board LWO forecast from public NOAA and ECMWF open data.
#
# GitHub runs `schedule` only from the default branch. A pull request, or a
# workflow_dispatch on any other branch, uploads an artifact and does not commit.
#
# unit-tests does not `needs` anything and forecast does not need it. A failed
# step skips the rest of its own job, and a failed job skips every job that
# lists it under `needs`. Putting the suite in the forecast job is what froze
# the file: the suite failed, the engine was skipped, and publish was skipped.
# The publish gate is the validator on the engine output, inside forecast.
name: LWO forecast

on:
  schedule:
    # Four times a day, about 5 h 17 min after the 00/06/12/18Z cycles, so the
    # HRRR and RRFS runs that reach f048, and GFS, are usually up. ECMWF open
    # data is often later; the engine keeps the newest published cycle within
    # 24 h. Minute 17, not 0 or 30: the schedule event is delayed under load,
    # and the start of the hour is a high-load time. A late or dropped run is
    # covered by the next one. UTC.
    - cron: "17 5,11,17,23 * * *"
  workflow_dispatch:
  pull_request:

# Queue a second schedule instead of cancelling it. A new pull-request push
# cancels only the previous pull-request run. A dispatch is its own group, so
# opening the pull request does not cancel it.
concurrency:
  group: lwo-forecast-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Run unit tests
        run: python -m unittest discover -s engine -t engine -p "test_validate.py"

  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the engine
        run: "python -m pip install --no-cache-dir --only-binary=:all: --require-hashes -r engine/requirements.lock"

      - name: Run the engine into staging
        env:
          LWO_EVENT: ${{ github.event_name }}
        run: bash scripts/run_lwo_job.sh

      - name: Upload the staging forecast
        if: always() && hashFiles('staging/lwo-forecast.json', 'staging/lwo-status.json', 'staging/lwo-run.log', 'staging/diff-summary.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: lwo-staging
          path: staging
          if-no-files-found: ignore
          retention-days: 14

      - name: Write the run summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            bash scripts/report_refresh.sh success none
          else
            bash scripts/report_refresh.sh failure open
          fi

  publish:
    needs: forecast
    # pull_request never reaches this job. workflow_dispatch publishes only
    # when it is started on main, the same branch the schedule uses.
    if: >-
      (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      github.ref == 'refs/heads/main' &&
      needs.forecast.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: write
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download the validated forecast
        uses: actions/download-artifact@v4
        with:
          name: lwo-staging
          path: staging

      - name: Commit the forecast when it is valid
        run: bash scripts/publish_if_valid.sh

      - name: Clear the failure issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report_refresh.sh success close

      - name: Note a publish failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/report_refresh.sh failure open
